name: Python Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'swig/**'
      - 'tests/**'
      - '.github/workflows/python_test.yml'

  pull_request:
    branches: [ main, feature/swig ]
    paths:
      - 'python/**'
      - 'swig/**'
      - 'tests/**'
      - '.github/workflows/python_test.yml'

  workflow_dispatch:

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7

      - name: Check for changes in source code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v46.0.1
        with:
          files: |
            python/**
            swig/**
            tests/**
            .github/workflows/python_test.yml

  tests:
    runs-on: ${{ matrix.os }}
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl swig || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install swig curl || true

      - name: Install python3 requirements...
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: cd /home/runner/work/purpleair_api/purpleair_api/ ;
             python -m pip install --upgrade wheel ;
             python -m pip install --upgrade setuptools ;
             python -m pip install --upgrade pip ;
             python -m pip install -r tests/requirements.txt ;
             python -m pip install ./python ;
          macos: cd /Users/runner/work/purpleair_api/purpleair_api/ ;
             python -m pip install --upgrade wheel ;
             python -m pip install --upgrade setuptools ;
             python -m pip install --upgrade pip ;
             python -m pip install -r tests/requirements.txt ;
             python -m pip install ./python ;
          windows: cd D:\a\purpleair_api\purpleair_api\ ;
               python -m pip install --upgrade wheel ;
               python -m pip install --upgrade setuptools ;
               python -m pip install --upgrade pip ;
               python -m pip install -r tests/requirements.txt ;
               python -m pip install ./python ;

      - name: Run unit tests...
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: cd /home/runner/work/purpleair_api/purpleair_api/tests ;
                 coverage run -m unittest && coverage json -o coverage_linux_${{ matrix.os }}_${{ matrix.python-version }}.json ;
          macos: cd /Users/runner/work/purpleair_api/purpleair_api/tests ;
                 coverage run -m unittest && coverage json -o coverage_macos_${{ matrix.os }}_${{ matrix.python-version }}.json ;
          windows: cd D:\a\purpleair_api\purpleair_api\tests ;
                   coverage run -m unittest && coverage json -o coverage_windows_${{ matrix.os }}_${{ matrix.python-version }}.json ;

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v5.1.2
        with:
          files: tests/coverage_*.json
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
