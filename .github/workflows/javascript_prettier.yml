name: javascript/prettier

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'javascript/**/*.js'
      - 'javascript/**/*.json'
      - '.github/workflows/javascript_prettier.yml'

  pull_request:
    branches: [ main, feature/swig ]

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes in JavaScript source code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v46.0.1
        with:
          files: |
            javascript/**/*.js
            javascript/**/*.json
            .github/workflows/javascript_prettier.yml

  prettier:
    runs-on: ubuntu-latest
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: javascript/package-lock.json

      - name: Install Prettier
        run: npm install --ignore-scripts -g prettier@3.2.4

      - name: Run Prettier
        run: prettier --check "javascript/**/*.{js,json}"
