name: Validate Workflow Files

concurrency:
  group: verify_syntax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '!.github/aw/**'
      - '!**/*.json'
      - 'tools/actionlint-version.txt'
      - '.github/actionlint.yaml'
      - '.yamllint'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '!.github/aw/**'
      - '!**/*.json'
      - 'tools/actionlint-version.txt'
      - '.github/actionlint.yaml'
      - '.yamllint'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_verify_syntax.yml@3178143deee5927b0b131bafef683efe8b2484b5
