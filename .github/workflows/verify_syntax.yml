name: Validate Workflow Files

concurrency:
  group: verify_syntax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '!.github/aw/**'
      - '!**/*.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '!.github/aw/**'
      - '!**/*.json'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Lint workflow YAML files
        run: |
          set -e
          echo "Linting workflow YAML files (excluding gh-aw lock/workflow files and json) in .github/workflows/ ..."
          find .github/workflows/ \( -name "*.yml" -o -name "*.yaml" \) \
            ! -name "*.lock.yml" \
            ! -name "*.lock.yaml" \
            ! -name "agentics-maintenance.yml" \
            ! -name "*.json" \
            ! -path "*/.github/aw/*" \
            -print0 | xargs -0 yamllint -c .yamllint
          echo "All workflow YAML files passed linting."
