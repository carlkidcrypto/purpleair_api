name: csharp/test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'codecov.yml'
      - 'csharp/**'
      - 'swig/**'
      - '.github/workflows/csharp_test.yml'

  pull_request:
    branches: [ main, feature/swig ]
    paths:
      - 'codecov.yml'
      - 'csharp/**'
      - 'swig/**'
      - '.github/workflows/csharp_test.yml'

  workflow_dispatch:

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for changes in C# source code
        id: changed-files
        uses: tj-actions/changed-files@c3a1bb2c992d77180ae65be6ae6c166cf40f857c # v46.0.1
        with:
          files: |
            codecov.yml
            csharp/**
            swig/**
            .github/workflows/csharp_test.yml

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet-version: ['6.0.x', '8.0.x']
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential mono-complete

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl swig mono || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install swig curl || true

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dgo_bindings=false -Djavascript_bindings=false

      - name: Build with Ninja
        run: ninja -C builddir

      - name: Build with dotnet
        working-directory: ./csharp
        run: dotnet build --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./csharp/tests
        run: |
          $env:PATH = "${{ github.workspace }}\builddir\csharp;${{ github.workspace }}\builddir\subprojects\curl-8.12.1\lib;C:\Strawberry\c\bin;" + $env:PATH
          dotnet test --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/ `
            --collect:"XPlat Code Coverage" `
            --logger "trx;LogFileName=csharp-test-results_${{ matrix.os }}_${{ matrix.dotnet-version }}.trx"

      - name: Run tests (Non-Windows)
        if: runner.os != 'Windows'
        working-directory: ./csharp/tests
        run: |
          dotnet test --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/ \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=csharp-test-results_${{ matrix.os }}_${{ matrix.dotnet-version }}.trx"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: csharp/tests/TestResults/**/coverage.cobertura.xml
          flags: csharp
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        if: always()
        with:
          name: csharp-test-results_${{ matrix.os }}_${{ matrix.dotnet-version }}
          path: csharp/tests/TestResults/csharp-test-results_${{ matrix.os }}_${{ matrix.dotnet-version }}.trx

  comment-csharp-test-report:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write
      contents: write
      checks: write
    if: always() && github.event_name == 'pull_request' && needs.test.result != 'skipped'
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: csharp-test-results_*
          path: test-results
          merge-multiple: false

      - name: Publish C# Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        with:
          files: test-results/**/*.trx
          check_name: C# Test Results
          comment_title: C# Test Results
