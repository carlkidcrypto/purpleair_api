name: NuGet Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  pack-and-publish-nuget:
    name: Pack and Publish To NuGet
    runs-on: ubuntu-latest
    needs: verify-syntax
    environment: build_and_publish_to_nuget
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install system dependencies & SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential mono-complete

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dgo_bindings=false -Djavascript_bindings=false

      - name: Build with Ninja
        run: ninja -C builddir

      - name: Build and Pack NuGet Package
        run: |
          dotnet pack csharp/PurpleAirAPI.csproj -c Release -o dist-nuget -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Upload NuGet Package Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: dist-nuget/*.nupkg

      - name: Authenticate with NuGet.org (OIDC Trusted Publishing)
        if: env.NUGET_API_KEY == ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: carlkidcrypto-nuget

      - name: Publish to NuGet.org
        run: |
          API_KEY="${NUGET_API_KEY:-${{ steps.nuget-login.outputs.NUGET_API_KEY }}}"
          if [ -n "$API_KEY" ]; then
            dotnet nuget push dist-nuget/*.nupkg --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "::warning ::No NuGet authentication provided; skipping NuGet.org upload. Distribution packages have been saved as workflow artifacts."
          fi

      - name: Publish to GitHub Packages
        if: env.GITHUB_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source --username carlkidcrypto --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/carlkidcrypto/index.json" || true
          dotnet nuget push dist-nuget/*.nupkg --api-key "$GITHUB_TOKEN" --source github --skip-duplicate || true
