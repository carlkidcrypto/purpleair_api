---
name: NuGet Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  pack-and-publish-nuget:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_nuget_publish.yml@3538efdfabdbcf0ae956cfc5685fd4c21a59696b
    with:
      project-path: csharp/PurpleAirAPI.csproj
      dotnet-version: '8.0.x'
      python-version: '3.14'
      environment-name: build_and_publish_to_nuget
      nuget-user: carlkidcrypto-nuget
      build-runtimes: false
      pack-setup-cmd: >-
        sudo apt-get update &&
        sudo apt-get install -y libcurl4-openssl-dev swig build-essential mono-complete &&
        pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1 &&
        meson setup builddir -Dgo_bindings=false -Djavascript_bindings=false &&
        ninja -C builddir
      pack-extra-args: -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/
      publish-github-packages: true
      github-packages-owner: carlkidcrypto
    secrets:
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
