# Build and publish C# bindings to NuGet
# https://learn.microsoft.com/en-us/nuget/quickstart/create-and-publish-a-package-using-the-dotnet-cli

name: csharp/build_and_publish
permissions:
  contents: read
concurrency: build_and_publish_csharp
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/csharp_build_and_publish.yml'

jobs:
  build_and_test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['6.0.x', '8.0.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential mono-complete

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl swig mono || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install swig curl || true

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dgo_bindings=false -Djavascript_bindings=false

      - name: Build with Ninja
        run: ninja -C builddir

      - name: Build with dotnet
        working-directory: ./csharp
        run: dotnet build --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./csharp/tests
        run: |
          $env:PATH = "${{ github.workspace }}\builddir\csharp;${{ github.workspace }}\builddir\subprojects\curl-8.12.1\lib;C:\Strawberry\c\bin;" + $env:PATH
          dotnet test --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Run tests (Non-Windows)
        if: runner.os != 'Windows'
        working-directory: ./csharp/tests
        run: dotnet test --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential mono-complete

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dgo_bindings=false -Djavascript_bindings=false

      - name: Build with Ninja
        run: ninja -C builddir

      - name: Pack NuGet package
        working-directory: ./csharp
        run: dotnet pack --configuration Release --output ./nupkg -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Publish to NuGet
        working-directory: ./csharp
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
