---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# https://cibuildwheel.pypa.io/en/stable/deliver-to-pypi/

name: PyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pypi:
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      target: pypi
      environment-name: build_and_publish_to_pypi
      build-mode: cibuildwheel
      package-subdir: python
      matrix-json: >-
        [{"os":"ubuntu-latest","arch":"x86_64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"},
        {"os":"windows-latest","arch":"AMD64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"},
        {"os":"macos-latest","arch":"arm64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"}]
      python-version: '3.11'
      skip-existing: true
      skip-publish: true

  publish:
    needs: build-pypi
    if: ${{ needs.build-pypi.outputs.artifacts-built == 'true' }}
    name: Publish distribution to PyPI
    runs-on: ubuntu-latest
    environment: build_and_publish_to_pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
