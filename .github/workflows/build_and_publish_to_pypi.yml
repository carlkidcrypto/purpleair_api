# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: PyPI Distributions
permissions:
  contents: read
  id-token: write
concurrency:
  group: build_and_publish_to_pypi
  cancel-in-progress: true
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-n-publish-pypi:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: build_and_publish_to_pypi

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build distribution
        uses: ./.github/actions/build-distribution

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        with:
          print-hash: true
