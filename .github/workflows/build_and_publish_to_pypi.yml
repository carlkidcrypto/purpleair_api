# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# https://cibuildwheel.pypa.io/en/stable/deliver-to-pypi/

name: PyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  build_wheels:
    needs: verify-syntax
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install cibuildwheel
        run: "python -m pip install --only-binary :all: cibuildwheel==2.22.0"

      - name: Build wheels
        run: python -m cibuildwheel python/ --output-dir dist/
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* cp36-* cp37-* cp38-* cp39-* cp310-* pp*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Install system dependencies
          CIBW_BEFORE_ALL_LINUX: "if command -v dnf >/dev/null 2>&1; then dnf install -y libcurl-devel swig; elif command -v yum >/dev/null 2>&1; then yum install -y libcurl-devel swig; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libcurl4-openssl-dev swig; fi"
          CIBW_BEFORE_ALL_MACOS: "brew install curl swig || true"
          CIBW_ENVIRONMENT_MACOS: PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig" MACOSX_DEPLOYMENT_TARGET="11.0"
          CIBW_BEFORE_ALL_WINDOWS: "choco install swig curl || true"
          # Build dependencies
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: ./dist/*.whl

  build_sdist:
    needs: verify-syntax
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          python -m pip install --only-binary :all: build==1.2.2.post1

      - name: Build sdist
        run: python -m build --sdist python/ --outdir dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, build_sdist]
    name: Build and Publish To PyPI
    runs-on: ubuntu-latest
    environment: build_and_publish_to_pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1.14
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
