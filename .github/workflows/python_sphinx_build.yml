---
name: Sphinx Docs Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'sphinx_docs_build/**'
      - 'python/**'
      - '.github/workflows/python_sphinx_build.yml'
  pull_request:
    branches: [main, feature/swig]
    paths:
      - 'sphinx_docs_build/**'
      - 'python/**'
      - '.github/workflows/python_sphinx_build.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  sphinx_docs_build:
    needs: verify-syntax
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_sphinx_build.yml@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
    with:
      python-version: '3.14'
      docs-dir: sphinx_docs_build
      requirements-file: sphinx_docs_build/requirements.txt
      extra-requirements-file: sphinx_docs_build/landing/requirements.txt
      output-dir: docs
      landing-dir: sphinx_docs_build/landing
      deploy-pages: true
      pre-build-cmd: >-
        sudo apt-get update &&
        sudo apt-get install -y libcurl4-openssl-dev swig &&
        python -m pip install ./python

  sphinx_docs_build_release:
    needs: verify-syntax
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository code at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.14 for Sphinx
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig

      - name: Install documentation requirements
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          python -m pip install --only-binary :all: -r sphinx_docs_build/requirements.txt
          python -m pip install --only-binary :all: -r sphinx_docs_build/landing/requirements.txt
          python -m pip install ./python

      - name: Build versioned documentation
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: sphinx-build -b html -W sphinx_docs_build/source "/tmp/html_${VERSION}/"

      - name: Switch to main branch and copy versioned documentation
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main
          git checkout main
          git pull origin main
          CLEAN_VER="${VERSION#v}"
          CLEAN_VER="${CLEAN_VER#V}"
          rm -rf "docs/html_v${CLEAN_VER}" "docs/html_V${CLEAN_VER}"
          cp -r "/tmp/html_${VERSION}" "docs/html_v${CLEAN_VER}"

      - name: Update landing page version list
        run: |
          python - <<'PY'
          import pathlib
          import re
          import shutil

          VERSION_RE = re.compile(
              r"^(?P<release>\d+(?:\.\d+)*)"
              r"(?:(?P<pre_sep>[.-]?)(?P<pre_type>dev|alpha|beta|rc|a|b)[.-]?(?P<pre_num>\d+)"
              r"|-(?P<dash_num>\d+))?$",
              re.IGNORECASE,
          )
          PRE_RANK = {"dev": 0, "a": 1, "alpha": 1, "b": 2, "beta": 2, "rc": 3}

          def parse_version_key(dir_name: str):
              clean = re.sub(r"^html_[vV]", "", dir_name).strip()
              match = VERSION_RE.match(clean)
              if not match:
                  return None
              release = tuple(int(part) for part in match.group("release").split("."))
              pre_type = match.group("pre_type")
              dash_num = match.group("dash_num")
              if pre_type is not None:
                  return (release, 0, PRE_RANK[pre_type.lower()], int(match.group("pre_num")))
              if dash_num is not None:
                  return (release, 0, 1, int(dash_num))
              return (release, 1, 99, 0)

          docs_dir = pathlib.Path("docs")
          index_rst = pathlib.Path("sphinx_docs_build/landing/source/index.rst")

          # Normalize legacy html_V* directories to html_v*
          for entry in sorted(docs_dir.iterdir(), key=lambda p: p.name):
              if entry.is_dir() and entry.name.startswith("html_V"):
                  target = docs_dir / ("html_v" + entry.name[6:])
                  if not target.exists():
                      entry.rename(target)
                  else:
                      shutil.rmtree(entry)

          version_dirs = [
              d for d in docs_dir.iterdir()
              if d.is_dir() and d.name.lower().startswith("html_v")
          ]
          parsed = [(d, parse_version_key(d.name)) for d in version_dirs]
          stable_keys = [k for _, k in parsed if k is not None and k[1] == 1]
          latest_stable = max(stable_keys) if stable_keys else None

          # Prune prereleases superseded by the latest formal stable release (CalSemVer + SemVer)
          active = []
          for d, key in parsed:
              if latest_stable is not None and key is not None and key[1] == 0 and key < latest_stable:
                  print(f"Retiring superseded prerelease docs {d.name}")
                  shutil.rmtree(d)
              else:
                  active.append((d, key))

          active.sort(
              key=lambda item: (item[1] is not None, item[1] or ((0,), 0, 0, 0), item[0].name),
              reverse=True,
          )
          entries = ["* `Latest Version <./html/index.html>`_"]
          entries.extend(
              f"* `v{re.sub(r'^html_[vV]', '', d.name)} <./{d.name}/index.html>`_"
              for d, _ in active
          )
          content = index_rst.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r"\.\. VERSION_LIST_START\n.*?\.\. VERSION_LIST_END",
              ".. VERSION_LIST_START\n\n" + "\n".join(entries) + "\n\n.. VERSION_LIST_END",
              content,
              flags=re.DOTALL,
          )
          if replacements != 1:
              raise SystemExit("Version list sentinels not found exactly once")
          index_rst.write_text(updated, encoding="utf-8")
          PY

      - name: Build landing page with updated version list
        run: |
          make -C sphinx_docs_build/landing clean
          make -C sphinx_docs_build/landing html SPHINXOPTS="-W"

      - name: Create pull request with versioned docs
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          title: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          body: "Adds Sphinx documentation for release ${{ github.event.release.tag_name }}."
          branch: docs/add-versioned-docs-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
          add-paths: |
            docs/
            sphinx_docs_build/landing/source/index.rst
