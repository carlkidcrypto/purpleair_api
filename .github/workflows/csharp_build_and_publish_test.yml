# Build and test C# bindings (test on main pushes)

name: csharp/build_and_publish_test
permissions:
  contents: read
concurrency: build_and_publish_csharp_test
on:
  push:
    branches: [ main ]
    paths:
      - 'csharp/**'
      - 'swig/**'
      - '.github/workflows/csharp_build_and_publish_test.yml'

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes in C# source
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v46.0.1
        with:
          files: |
            csharp/**
            swig/**
            .github/workflows/csharp_build_and_publish_test.yml

  build_and_test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['6.0.x', '8.0.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential mono-complete

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl swig mono || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install swig curl || true

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dgo_bindings=false -Djavascript_bindings=false

      - name: Build with Ninja
        run: ninja -C builddir

      - name: Build with dotnet
        working-directory: ./csharp
        run: dotnet build --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./csharp/tests
        run: |
          $env:PATH = "${{ github.workspace }}\builddir\csharp;${{ github.workspace }}\builddir\subprojects\curl-8.12.1\lib;C:\Strawberry\c\bin;" + $env:PATH
          dotnet test --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/

      - name: Run tests (Non-Windows)
        if: runner.os != 'Windows'
        working-directory: ./csharp/tests
        run: dotnet test --configuration Release -p:GeneratedSourcesDir=${{ github.workspace }}/builddir/csharp/
