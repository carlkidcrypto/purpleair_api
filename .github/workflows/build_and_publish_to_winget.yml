---
name: WinGet Distributions (FUTURE / WIP)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - 'tools/generate_winget_manifest.py'
      - '.github/workflows/build_and_publish_to_winget.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for WinGet distribution (e.g. v2026.11.3)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish-winget:
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_winget_publish.yml@14e025f6c182b7b20718538f533ca467a9ff9c6c
    with:
      package-identifier: carlkidcrypto.PurpleAirAPI
      installer-filename: PurpleAirAPI-Windows-x64-Setup.exe
      release-tag: ${{ github.event.inputs.release_tag }}
      python-version: '3.14'
      version-reader-fn: _read_current_version
      manifest-generator-script: tools/generate_winget_manifest.py
      installer-type: inno
    secrets:
      winget-acc-token: ${{ secrets.WINGET_ACC_TOKEN }}
