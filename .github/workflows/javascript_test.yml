name: javascript/test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'codecov.yml'
      - 'javascript/**'
      - 'swig/**'
      - '.github/workflows/javascript_test.yml'

  pull_request:
    branches: [ main, feature/swig ]
    paths:
      - 'codecov.yml'
      - 'javascript/**'
      - 'swig/**'
      - '.github/workflows/javascript_test.yml'

  workflow_dispatch:

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes in JavaScript source code
        id: changed-files
        uses: tj-actions/changed-files@c3a1bb2c992d77180ae65be6ae6c166cf40f857c # v46.0.1
        with:
          files: |
            codecov.yml
            javascript/**
            swig/**
            .github/workflows/javascript_test.yml

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node-version: ['18.x', '20.x', '22.x', '24.x']
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: javascript/package-lock.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl swig || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install swig || true
          vcpkg integrate install
          vcpkg install curl:x64-windows
          Add-Content $env:GITHUB_PATH "C:\vcpkg\installed\x64-windows\bin"

      - name: Install dependencies
        working-directory: ./javascript
        run: npm ci --ignore-scripts

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dcsharp_bindings=false -Dgo_bindings=false

      - name: Build SWIG wrapper with Ninja
        run: ninja -C builddir

      - name: Build native addon
        working-directory: ./javascript
        run: npm run build-gyp

      - name: Run tests (Non-Windows)
        if: runner.os != 'Windows'
        working-directory: ./javascript
        run: |
          npm test -- --ci --reporters=default --reporters=jest-junit \
            --coverage --coverageReporters=cobertura --coverageReporters=lcov --coverageReporters=text
          mv junit.xml "junit_${{ matrix.os }}_${{ matrix.node-version }}.xml"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./javascript
        run: |
          npm test -- --ci --reporters=default --reporters=jest-junit `
            --coverage --coverageReporters=cobertura --coverageReporters=lcov --coverageReporters=text
          Move-Item -Path junit.xml -Destination "junit_${{ matrix.os }}_${{ matrix.node-version }}.xml"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: javascript/coverage/cobertura-coverage.xml
          flags: javascript
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        if: always()
        with:
          name: javascript-test-results_${{ matrix.os }}_${{ matrix.node-version }}
          path: javascript/junit_${{ matrix.os }}_${{ matrix.node-version }}.xml

  comment-javascript-test-report:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write
      contents: write
      checks: write
    if: always() && github.event_name == 'pull_request' && needs.test.result != 'skipped'
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: javascript-test-results_*
          path: test-results
          merge-multiple: false

      - name: Publish JavaScript Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        with:
          files: test-results/**/*.xml
          check_name: JavaScript Test Results
          comment_title: JavaScript Test Results
