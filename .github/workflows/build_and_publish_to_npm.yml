name: npm Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  publish-npm:
    name: Build and Publish To npm
    runs-on: ubuntu-latest
    needs: verify-syntax
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install system dependencies & SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: javascript/package-lock.json

      - name: Validate release tag
        if: github.ref_type == 'tag'
        working-directory: javascript
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          if [[ "$expected_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          elif [[ "$expected_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}-alpha.${BASH_REMATCH[2]}"
          elif [[ "$expected_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}"
          elif [[ "$expected_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}-rc.${BASH_REMATCH[2]}"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [ "$expected_version" != "$package_version" ]; then
            echo "Tag $RELEASE_TAG (expected npm version $expected_version) does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dcsharp_bindings=false -Dgo_bindings=false

      - name: Build SWIG wrapper with Ninja
        run: ninja -C builddir

      - name: Install Node dependencies
        working-directory: javascript
        run: npm ci --ignore-scripts

      - name: Build native Node addon
        working-directory: javascript
        run: npm run build-gyp

      - name: Inspect package contents (dry-run)
        working-directory: javascript
        run: npm pack --dry-run

      - name: Pack npm tarball
        working-directory: javascript
        run: npm pack

      - name: Upload npm package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: javascript/*.tgz

      - name: Publish to npm
        working-directory: javascript
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            export NODE_AUTH_TOKEN="${{ secrets.NPM_TOKEN }}"
          fi
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Notice: ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm; skipping publish step."
            exit 0
          fi
          TARBALL=$(ls -1 purpleair-api-*.tgz 2>/dev/null | head -n 1)
          if [[ "$PACKAGE_VERSION" =~ -alpha\. ]] || \
             [[ "$PACKAGE_VERSION" =~ -a[0-9] ]] || \
             [[ "$PACKAGE_VERSION" =~ -beta\. ]] || \
             [[ "$PACKAGE_VERSION" =~ -rc\. ]] || \
             [[ "$PACKAGE_VERSION" =~ -[0-9]+$ ]]; then
            echo "Publishing prerelease version $PACKAGE_VERSION with tag 'next'..."
            if [ -n "$TARBALL" ]; then
              npm publish "$TARBALL" --access public --provenance --tag next
            else
              npm publish --access public --provenance --tag next
            fi
          else
            echo "Publishing release version $PACKAGE_VERSION with tag 'latest'..."
            if [ -n "$TARBALL" ]; then
              npm publish "$TARBALL" --access public --provenance --tag latest
            else
              npm publish --access public --provenance --tag latest
            fi
          fi
