---
name: npm Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_npm_publish.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      working-directory: javascript
      node-version: '24'
      needs-python: true
      python-version: '3.14'
      setup-cmd: >-
        sudo apt-get update &&
        sudo apt-get install -y libcurl4-openssl-dev swig build-essential &&
        pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1 &&
        meson setup builddir -Dcsharp_bindings=false -Dgo_bindings=false &&
        ninja -C builddir
      install-cmd: npm ci --ignore-scripts
      build-cmd: npm run build-gyp
      validate-release-tag: true
      pack-and-upload-artifact: true
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
