name: Go Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  publish-go:
    name: Build and Verify Go Distribution
    runs-on: ubuntu-latest
    needs: verify-syntax
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.sum

      - name: Install system dependencies & SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev swig build-essential

      - name: Install Meson and Ninja
        run: "pip install --only-binary :all: meson==1.3.2 ninja==1.11.1.1"

      - name: Configure with Meson
        run: meson setup builddir -Dcsharp_bindings=false -Djavascript_bindings=false

      - name: Build with Ninja
        run: ninja -C builddir

      - name: Run Go tests
        working-directory: ./go
        run: go test -v ./tests/...

      - name: Package Go module archive
        run: |
          mkdir -p dist-go
          tar -czf dist-go/purpleair_api-go.tar.gz -C go .

      - name: Upload Go Module Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-module-archive
          path: dist-go/*.tar.gz

      - name: Pre-warm Go module proxy
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [ -n "$TAG" ]; then
            echo "Pre-warming Go module proxy for github.com/carlkidcrypto/purpleair_api/go@${TAG}..."
            GOPROXY=https://proxy.golang.org go list -m "github.com/carlkidcrypto/purpleair_api/go@${TAG}" || echo "Notice: Go proxy indexing will complete once release tag is indexed."
          fi
