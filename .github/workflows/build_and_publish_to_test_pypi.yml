# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions
permissions:
  contents: read
  id-token: write
concurrency:
  group: build_and_publish_to_test_pypi
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  workflow_dispatch:

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes in setup.py/cfg
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v46.0.1
        with:
          files: |
            setup.py
            setup.cfg
            pyproject.toml
            .github/actions/build-distribution/action.yml
            .github/workflows/build_and_publish_to_test_pypi.yml

  build-n-publish-test-pypi:
    name: Build and Publish To Test PyPi
    runs-on: ubuntu-latest
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true'
    environment: build_and_publish_to_test_pypi

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build distribution
        uses: ./.github/actions/build-distribution

      - name: Publish distribution 📦 to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
