---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# https://cibuildwheel.pypa.io/en/stable/deliver-to-pypi/

name: TestPyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'swig/**'
      - '.github/workflows/build_and_publish_to_test_pypi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-test-pypi:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@14e025f6c182b7b20718538f533ca467a9ff9c6c
    with:
      target: testpypi
      build-mode: cibuildwheel
      package-subdir: python
      matrix-json: >-
        [{"os":"ubuntu-latest","arch":"x86_64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"},{"os":"windows-latest","arch":"AMD64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"},{"os":"macos-latest","arch":"arm64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"}]
      python-version: '3.11'
      check-changes: true
      changed-files-patterns: |
        python/**
        swig/**
        .github/workflows/build_and_publish_to_test_pypi.yml
      skip-existing: true
