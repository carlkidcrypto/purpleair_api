version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Agentic workflow lock files are auto-generated by gh aw compile.
    # Dependabot should not open PRs for those manifests.
    exclude-paths:
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/*.md"
      - ".github/agents/*.md"
      - ".github/aw/*.lock.json"

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Maintain JavaScript/Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain C#/.NET dependencies
  - package-ecosystem: "nuget"
    directory: "/csharp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Go dependencies
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for pip (tests)
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Maintain dependencies for pip (sphinx_docs_build)
  - package-ecosystem: "pip"
    directory: "/sphinx_docs_build"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
