updates:
- directory: /
  # Agentic workflow lock files are auto-generated by gh aw compile.
  # Dependabot should not open PRs for those manifests.
  exclude-paths:
    - ".github/workflows/agentics-maintenance.yml"
    - ".github/workflows/*.lock.yml"
    - ".github/workflows/*.md"
    - ".github/agents/*.md"
    - ".github/aw/*.lock.json"
  package-ecosystem: github-actions
  open-pull-requests-limit: 10
  schedule:
    interval: daily
- package-ecosystem: pip
  directories:
    - "/"
    - "/tests"
    - "/sphinx_docs_build"
  open-pull-requests-limit: 10
  schedule:
    interval: daily
version: 2
