[build-system]
requires = ["meson-python", "meson>=1.12.1", "ninja", "swig"]
build-backend = "mesonpy"

[project]
name = "purpleair_api"
version = "2026.11.11a2"
description = "PurpleAir API wrapper with C++ backend and SWIG bindings"
readme = "../README.rst"
license = {text = "MIT"}
authors = [
    {name = "Carlos Santos", email = "dose.lucky.sake@cloak.id"}
]
keywords = [
    "purpleair_api",
    "purple air api",
    "purple_air",
    "purple air",
    "purpleair_sensor",
    "purpleair sensor",
    "purpleair-sensor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/carlkidcrypto/purpleair_api"
Repository = "https://github.com/carlkidcrypto/purpleair_api"
Documentation = "https://github.com/carlkidcrypto/purpleair_api"

[project.optional-dependencies]
dev = [
    "pytest",
    "requests-mock",
    "black",
    "coverage",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313', 'py314', 'py315']

[tool.meson-python]
allow-windows-internal-shared-libs = true

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
build-frontend = "build"
skip = "*-musllinux_* cp36-* cp37-* cp38-* cp39-* cp310-* pp*"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "if command -v dnf >/dev/null 2>&1; then dnf install -y libcurl-devel swig; elif command -v yum >/dev/null 2>&1; then yum install -y libcurl-devel swig; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libcurl4-openssl-dev swig; fi"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install swig || true"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "choco install swig curl || true"

