# CodeCov configuration for purpleair_api
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# Coverage configuration
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: auto
        threshold: 1%
        informational: false

# Ignore paths - exclude test files and configuration from coverage reports
ignore:
  - "python/tests/**"
  - "tests/**"
  - "csharp/tests/**"
  - "javascript/tests/**"
  - "go/tests/**"
  - "test_*.py"
  - "**/test_*.py"
  - "**/*_test.go"
  - "setup.py"
  - "setup.cfg"
  - "python/setup.cfg"
  - "release_tools/**"
  - ".github/**"
  - "docs/**"
  - "sphinx_docs_build/**"
  - "subprojects/**"
  - "builddir/**"
  - "purpleair_api/purpleairapi_base.py"
  - "python/purpleair_api/purpleairapi_base.py"
  - "swig/purpleairapi_base_wrap.cxx"

# Flag management: exactly ONE flag per upload (language).
# Carryforward replaces a carried-forward session whenever ANY of its flags is
# uploaded again. Unique flags keep each workflow's coverage carried forward
# independently when its tests are skipped.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: python
      paths:
        - python/*.py
        - python/**/*.py
    - name: javascript
      paths:
        - javascript/*.js
        - javascript/**/*.js
        - javascript/*.json
        - javascript/**/*.json
    - name: csharp
      paths:
        - csharp/*.cs
        - csharp/**/*.cs
    - name: go
      paths:
        - go/*.go
        - go/**/*.go
    - name: cpp
      paths:
        - swig/*.h
        - swig/**/*.h
        - swig/*.cpp
        - swig/**/*.cpp
        - swig/*.hpp
        - swig/**/*.hpp
        - swig/*.i
        - swig/**/*.i

# Comment configuration for pull requests
comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: false

# Component configuration to track each language separately.
# Only components with active hand-authored source code in the repository are
# listed. C# SWIG wrapper classes are generated at build time in builddir/csharp/
# (git-ignored) and C++ sources in swig/ are exercised via language bindings.
component_management:
  individual_components:
    - component_id: python_code
      name: "Python Code"
      paths:
        - python/*.py
        - python/**/*.py
    - component_id: javascript_code
      name: "JavaScript Code"
      paths:
        - javascript/*.js
        - javascript/**/*.js
        - javascript/*.json
        - javascript/**/*.json
    - component_id: go_code
      name: "Go Code"
      paths:
        - go/*.go
        - go/**/*.go
