# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

# Exclude built documentation and GitHub Actions workflows from static code analysis (security, reliability, maintainability)
sonar.exclusions=docs/**,.github/**

# Exclude built documentation, workflows, and tests from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,.github/**,tests/**,python/tests/**,csharp/tests/**,javascript/tests/**,go/tests/**,java/tests/**
